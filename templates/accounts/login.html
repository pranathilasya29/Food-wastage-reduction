
{% extends "base.html" %}

{% block title %}Login | FoodShare{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Login</button>
    </form>
    <p>New user? <a href="{% url 'register' %}">Create an account</a></p>
</div>
{% endblock %}
