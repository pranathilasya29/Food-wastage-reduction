
{% extends "base.html" %}

{% block title %}Register | FoodShare{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Create an Account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">Register</button>
    </form>
    <p>Already registered? <a href="{% url 'login' %}">Login here</a></p>
</div>
{% endblock %}
